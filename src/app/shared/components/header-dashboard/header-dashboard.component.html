<header class="fixed top-0 z-30 p-0 m-0 h-16 w-full shadow-sm">
  <nav class="relative flex items-center 2xl:justify-between lg:justify-start justify-between
     xs:px-10 px-4 py-11 size-full bg-bs-primary text-white">
    <!-- Logo and Title -->
    <div class="flex items-center">
      <a routerLink="/dashboard/{{user()?.role}}" class="flex items-center justify-center h-full xs:w-80 xl:ml-28 rounded"
        aria-label="Ir a la página de inicio de BarberApp">
        <h1 class="text-3xl font-semibold text-white hidden lg:block object-contain xl:w-72 lg:w-48 w-32">BarberApp
        </h1>
        <h1 class="text-3xl font-semibold text-white block lg:hidden object-contain lg:w-72 w-56">BarberApp</h1>
      </a>
      <hr class="ml-16 h-14 w-0.5 bg-white hidden lg:block" />
      <app-svg-icon class="ml-3 hidden lg:block" [icon]="userRoleIcon" size="36px"></app-svg-icon>
      <p class="ml-2 font-bold text-xl tracking-tight hidden lg:block">
        {{ title }}
      </p>
    </div>

    <!-- Submenu button -->
    <div class="2xl:mr-40 2xl:ml-0 xl:ml-24 xs:ml-8">
      <app-user-submenu></app-user-submenu>
    </div>

    <!-- Help Button -->
    <a routerLink="/info/user/help" class="absolute right-4 hidden 2xl:flex flex-col justify-center items-center rounded-xl
       py-2 px-4 gap-0.5 hover:bg-bs-third/60 hover:shadow active:bg-bs-third/30 transition duration-300">
      <app-svg-icon icon="help" size="32px" class="text-white"></app-svg-icon>
      <span class="text-sm text-white">Ayuda</span>
    </a>
  </nav>
</header>
