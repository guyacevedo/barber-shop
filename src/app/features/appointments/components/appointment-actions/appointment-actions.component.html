<div class="mt-8">
  <!-- Title -->
  <div
    class="hidden mb-4 md:flex xs:flex-row flex-col flex-wrap xs:gap-2 gap-1 sm:justify-start justify-center items-center">
    <app-svg-icon icon="actions" size="32px"></app-svg-icon>
    <h3 class="text-2xl font-semibold">Acciones</h3>
  </div>

  <!-- Content -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:flex  gap-4 justify-start">
    @for (action of currentActions; track action.label) {
    <button (click)="action.handler()"
      class="flex items-center justify-center gap-2 px-6 py-3 rounded-xl  text-base font-bold transition-transform transform hover:scale-105 shadow-lg"
      [ngClass]="[
          action.textColor || 'text-black',
          action.bgColor || 'bg-gray-200',
          action.bgColorHover || 'hover:bg-gray-300',
          action.bgColorActive || 'active:bg-gray-400'
        ]">
      <app-svg-icon [icon]="$any(action.icon)" size="32px">
      </app-svg-icon>
      {{ action.label }}
    </button>
    } @empty {
    <p class="m-0 flex justify-center items-center text-gray-500">Sin acciones disponibles.</p>
    }
  </div>
</div>
