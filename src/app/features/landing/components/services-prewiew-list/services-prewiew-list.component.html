<div class="lg:max-w-home-page max-w-184 mt-10 mx-6">
    <div class="mx-auto max-w-home-page">
        <!-- Title -->
        <div class="mb-5 px-4 sm:px-6 lg:px-8">
            <h3 class="md:text-4xl text-3xl text-center font-bold tracking-tight text-bs-third">
                {{ title }}
            </h3>
        </div>

        <!-- Services Grid -->
        <div class="grid grid-cols-1 gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-3">
            @for (service of servicesList(); track service.id; let i = $index) {
            <div
                class="block group bg-white rounded-lg shadow-sm animate-on-scroll transition duration-300 overflow-hidden"
                [ngClass]="i === 3 ? 'hidden sm:block lg:hidden' : ''">
                <article class="flex flex-col">
                    <!-- Image -->
                    <div class="w-full overflow-hidden img-fade-container">
                        <picture>
                            <source media="(max-width: 767px)" [srcset]="getMobileImageUrl(service.imageUrl)" />
                            <img loading="lazy" [src]="service.imageUrl" [alt]="'Imagen del servicio: ' + service.title"
                                class="w-full h-full object-cover img-fade-in" />
                        </picture>
                    </div>

                    <!-- Content -->
                    <div class="flex flex-col justify-between flex-grow px-6 py-4  min-h-40">
                        <!-- Title -->
                        <h3
                            class="text-lg text-pretty font-semibold text-bs-primary group-hover:text-bs-third transition-colors duration-300">
                            {{ service.title }}
                        </h3>

                        <!-- Summary -->
                        <p class="mt-3 text-sm text-gray-800 text-pretty flex-grow">
                            {{ service.summary }}
                        </p>

                        <!-- Tags -->
                        <div class="mt-4 flex flex-wrap gap-2">
                            @for(tag of service.tags; track tag){
                            <span
                                class="inline-flex items-center rounded-md bg-lightblue-secondary/70 px-2 py-1 text-xs font-medium text-bs-third">{{
                                tag }}
                            </span>
                            }
                        </div>
                    </div>
                </article>
            </div>
            } @empty {
            <div class="mt-12">
                <p class="text-gray-600">Sin servicios a ofertar actualmente.</p>
            </div>
            }
        </div>

        <div class="mt-6 text-center">
            <a routerLink="/info/especialidades-y-servicios"
                class="group px-3 text-lg font-semibold text-bs-primary hover:text-bs-third transition-colors underline underline-offset-2 flex justify-center items-center gap-0.5">
                Ver más
                <app-svg-icon icon="link" size="18px"
                    class="group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition">
                </app-svg-icon>
            </a>
        </div>
    </div>
</div>
