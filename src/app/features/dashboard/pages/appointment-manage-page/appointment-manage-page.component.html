@if (!authFacade.user() || authFacade.isCheckingAuth() || isLoading()) {
<app-splash></app-splash>
} @else {
<div class="flex-grow mx-auto px-4 sm:px-6 lg:px-8 ">
  <div class="max-w-7xl lg:max-w-4xl mx-auto">
    <button [routerLink]="backButtonUrl()"
      class="mb-4 flex flex-wrap sm:justify-center justify-start items-center gap-1 rounded-full px-6 py-1.5 cursor-pointer hover:text-bs-third w-auto  hover:bg-bs-secondary/50 active:bg-bs-secondary/90 transition duration-300  outline-bs-primary">
      <app-svg-icon icon="backArrow" size="36px"></app-svg-icon>
      <span class="text-lg">{{ backButtonText() }}</span>
    </button>

    @if (error()) {
    <div class="flex px-10 py-3 justify-center items-center
       mt-12 m-0 gap-2 bg-amber-200 border-2
        border-amber-300 text-black rounded">
      <p class="h-full text-pretty w-full text-lg">
        Ocurrió un error al buscar el turno solicitado. Intentá más tarde.
      </p>
    </div>
    } @else if (appointment()) {
    <!-- Appointment Information -->
    <div class="w-full">
      <app-appointment-info [appointment]="appointment()!" [user]="oppositeUser()"></app-appointment-info>
    </div>

    <!-- Actions -->
    <div class="w-full">
      <app-appointment-actions [userRoleToShow]="
          authFacade.user()?.role === 'client' ? 'client' : 'specialist'
        " [appointment]="appointment()!" (cancelAppointment)="handleCancelAppointment($event)"
        (completeAppointment)="handleCompleteAppointment($event)"
        (rateAppointment)="handleRateAppointment($event)"></app-appointment-actions>
    </div>
    } @else {
    <div class="flex px-10 py-3 justify-center items-center
       mt-12 m-0 gap-2 bg-amber-200 border-2
        border-amber-300 text-black rounded">
      <p class="h-full text-pretty w-full text-lg">
        Ocurrió un error al buscar el turno solicitado. Intentá más tarde.
      </p>
    </div>
    }
  </div>
</div>
}
